<!doctype html>
<html lang="en" data-solcord-mode="solcord-dark" data-solcord-accent="glacier" data-solcord-density="comfortable" data-solcord-message-shape="discord" data-solcord-motion="subtle" data-solcord-effective-motion="subtle">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solcord Control Center fixture</title>
    <script>
        (() => {
            const params = new URLSearchParams(location.search);
            const root = document.documentElement;
            root.dataset.solcordMode = params.get("mode") || "solcord-dark";
            root.dataset.solcordAccent = params.get("accent") || "glacier";
            root.dataset.solcordDensity = params.get("density") || "comfortable";
            root.dataset.solcordMessageShape = params.get("shape") || "discord";
            root.dataset.solcordMotion = params.get("motion") || "subtle";
            root.dataset.solcordEffectiveMotion = params.get("motion") || "subtle";
            root.dataset.solcordFixtureScale = params.get("scale") || "100";
            root.dataset.solcordFixtureTheme = params.get("theme") || "none";
            const themes = {
                "solcord-default": "Solcord-Default.theme.css",
                "obsidian-thread": "Solcord-ObsidianThread.theme.css",
                "carbon-ember": "Solcord-CarbonEmber.theme.css",
                "midnight-glass": "Solcord-MidnightGlass.theme.css",
                "paper-signal": "Solcord-PaperSignal.theme.css",
                "threadline": "Solcord-Threadline.theme.css",
                "signal-block": "Solcord-SignalBlock.theme.css",
                "relay-classic": "Solcord-RelayClassic.theme.css",
                "workshop": "Solcord-Workshop.theme.css",
                "quiet-read": "Solcord-QuietRead.theme.css",
                "night-transit": "Solcord-NightTransit.theme.css"
            };
            window.__solcordFixtureThemeFile = themes[params.get("theme")] || "";
        })();
    </script>
    <link rel="stylesheet" href="../../src/betterdiscord/styles/solcord.css">
    <script>
        if (window.__solcordFixtureThemeFile) document.write(`<link rel="stylesheet" href="../../assets/themes/${window.__solcordFixtureThemeFile}">`);
    </script>
    <style>
        :root {
            --font-primary: "Solcord Hanken", "Segoe UI", sans-serif;
            --font-display: var(--font-primary);
            --font-code: "Cascadia Code", Consolas, monospace;
            --brand-500: #5865f2;
            --brand-560: #4752c4;
            --green-360: #23a55a;
            --status-danger: #da373c;
            --button-filled-brand-background: #5865f2;
            --button-filled-brand-background-hover: #4752c4;
        }
        html, body { min-width: 0; min-height: 100%; margin: 0; }
        body {
            --background-primary: #313338;
            --background-secondary: #2b2d31;
            --background-secondary-alt: #232428;
            --background-tertiary: #1e1f22;
            --background-floating: #111214;
            --background-modifier-hover: rgb(255 255 255 / 6%);
            --background-modifier-active: rgb(255 255 255 / 9%);
            --background-modifier-selected: rgb(255 255 255 / 12%);
            --background-modifier-accent: rgb(255 255 255 / 10%);
            --border-subtle: rgb(255 255 255 / 12%);
            --border-strong: rgb(255 255 255 / 26%);
            --text-normal: #dbdee1;
            --text-muted: #a5abb4;
            --text-link: #00a8fc;
            --header-primary: #f2f3f5;
            --header-secondary: #b5bac1;
            --interactive-normal: #b5bac1;
            --interactive-hover: #dbdee1;
            --interactive-active: #ffffff;
            --interactive-muted: #5d6169;
            --input-background: #1e1f22;
            color: var(--text-normal);
            background: var(--background-tertiary);
            font: 14px/1.45 var(--font-primary);
        }
        button, input, select, textarea { font: inherit; }
        #app-mount { min-height: 100vh; background: var(--background-tertiary); }
        .fixture-shell { box-sizing: border-box; width: min(100%, 1240px); min-height: 100vh; margin: 0 auto; padding: 22px 24px 48px; background: var(--background-primary); }
        .fixture-mark { width: 100%; height: 100%; object-fit: contain; }
        .fixture-only { position: fixed; left: -10000px; top: 0; }
        @media (max-width: 520px) { .fixture-shell { padding: 0; } }
    </style>
</head>
<body>
<div id="app-mount" class="theme-dark">
    <div class="fixture-shell">
        <main class="solcord-panel solcord-density-comfortable solcord-motion-subtle" data-critical="panel">
            <header class="solcord-header" data-critical="header">
                <div class="solcord-mark" aria-hidden="true"><img class="fixture-mark" src="../../assets/branding/solcord-mark.svg" alt=""></div>
                <div class="solcord-header-copy"><h1>Solcord</h1><p>Control Center</p></div>
            </header>
            <div class="solcord-control-center" data-critical="control-center">
                <nav class="solcord-workspace-nav" aria-label="Solcord settings" data-critical="navigation">
                    <label class="solcord-workspace-search"><span class="sr-only">Filter Solcord settings</span><input type="search" placeholder="Find a setting"></label>
                    <div class="solcord-workspace-nav-list">
                        <section aria-label="Start"><p>Start</p><button type="button" data-workspace="overview"><strong>Overview</strong></button></section>
                        <section aria-label="Personalize"><p>Personalize</p><button type="button" data-workspace="appearance"><strong>Appearance &amp; Accessibility</strong></button><button type="button" data-workspace="performance"><strong>Performance</strong></button></section>
                        <section aria-label="Features"><p>Features</p><button type="button" data-workspace="privacy"><strong>Privacy &amp; Safety</strong></button><button type="button" data-workspace="chat"><strong>Chat &amp; Composer</strong></button><button type="button" data-workspace="voice"><strong>Voice &amp; Activities</strong></button><button type="button" data-workspace="friends"><strong>Friends &amp; Spaces</strong></button></section>
                        <section aria-label="System"><p>System</p><button type="button" data-workspace="extensions"><strong>Extensions</strong></button><button type="button" data-workspace="recovery"><strong>Recovery</strong></button></section>
                    </div>
                    <details class="solcord-workspace-menu"><summary>Overview</summary><div><button type="button" data-workspace="overview">Overview</button><button type="button" data-workspace="appearance">Appearance &amp; Accessibility</button><button type="button" data-workspace="performance">Performance</button><button type="button" data-workspace="privacy">Privacy &amp; Safety</button><button type="button" data-workspace="chat">Chat &amp; Composer</button><button type="button" data-workspace="voice">Voice &amp; Activities</button><button type="button" data-workspace="friends">Friends &amp; Spaces</button><button type="button" data-workspace="extensions">Extensions</button><button type="button" data-workspace="recovery">Recovery</button></div></details>
                </nav>
                <div id="workspace" class="solcord-workspace" data-critical="workspace"></div>
            </div>
        </main>
    </div>
</div>
<pre id="fixture-result" class="fixture-only" aria-hidden="true"></pre>
<script>
    const params = new URLSearchParams(location.search);
    const workspace = params.get("workspace") || "overview";
    const state = params.get("state") || "healthy";
    const diagnostic = params.get("diagnostic") === "1";
    const switchMatrix = params.get("switches") === "1";
    const longCopy = params.get("long") === "1";
    const fixtureWidth = Number(params.get("fixtureWidth"));
    if (Number.isFinite(fixtureWidth) && fixtureWidth >= 280) document.querySelector(".fixture-shell").style.width = `${fixtureWidth}px`;
    if (diagnostic) document.querySelector(".solcord-header-copy").insertAdjacentHTML("beforeend", `<span class="solcord-build-warning" role="status">Diagnostic build</span>`);
    const content = document.querySelector("#workspace");
    const workspaceNames = {
        overview: ["Overview", "Current state and the next useful action."],
        appearance: ["Appearance & Accessibility", "Make Discord easier to read and comfortable to use."],
        performance: ["Performance", "Choose how much optional work Solcord does."],
        privacy: ["Privacy & Safety", "Control optional outbound data and local privacy tools."],
        chat: ["Chat & Composer", "Writing, replies, previews, and local draft tools."],
        voice: ["Voice & Activities", "Call context, Activity compatibility, and manually armed experiments."],
        friends: ["Friends & Spaces", "Local organization and opt-in relationship history."],
        extensions: ["Extensions", "Optional community software and migration tools."],
        recovery: ["Recovery", "Backups, rollback, setup, and focused diagnostics."]
    };
    const action = (label, tone = "neutral") => `<button type="button" class="solcord-action solcord-action-${tone}">${label}</button>`;
    const switchControl = (title, checked = false, disabled = false) => `<span class="solcord-switch"><input type="checkbox" role="switch" aria-label="${title}" aria-checked="${checked}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}><span class="solcord-switch-track" aria-hidden="true"><span class="solcord-switch-thumb"></span></span></span>`;
    const toggle = (title, copy, checked = false) => `<div class="solcord-setting-row" data-critical="row"><span><strong>${title}</strong><small>${copy}</small></span>${switchControl(title, checked)}</div>`;
    const heading = (id) => `<header class="solcord-workspace-heading" data-critical="workspace-heading"><h2 tabindex="-1">${workspaceNames[id][0]}</h2><p>${workspaceNames[id][1]}</p></header>`;
            const section = (title, summary, body) => `<section class="solcord-section"><div class="solcord-section-heading"><h3>${title}</h3>${summary ? `<p>${summary}</p>` : ""}</div>${body}</section>`;
    const allClear = `<div class="solcord-all-clear" role="status"><strong>All clear</strong><span>Protection is active and no action is needed.</span></div>`;

    const screens = {
        overview: () => `${heading("overview")}${state === "setup" ? `<div class="solcord-setup-reminder"><span><strong>Setup is saved for later.</strong><small>Nothing changed. Resume whenever you are ready.</small></span>${action("Resume")}</div>` : ""}${section("Right now", "", state === "degraded" ? `<div class="solcord-pulse-list"><div class="solcord-pulse solcord-pulse-attention"><div><strong>Privacy adapter needs review</strong><p>Optional telemetry remains blocked while Solcord waits for a verified client surface.</p></div>${action("Review")}</div></div>` : `<div class="solcord-all-clear" role="status"><strong>All clear</strong><span>No Solcord action needs attention.</span></div>`)}`,
        appearance: () => `${heading("appearance")}${section("Theme", "Changes preview immediately and can be reset without a restart.", `<div class="solcord-appearance-controls"><label>Mode<select><option>Solcord Dark</option><option>Solcord Light</option><option>OLED</option></select></label><label>Density<select><option>Comfortable</option><option>Compact</option></select></label><fieldset class="solcord-effect-color"><legend>Effect color</legend><div role="radiogroup" aria-label="Effect color"><button type="button" role="radio" aria-checked="true" aria-label="Use Glacier effect color"><i aria-hidden="true" style="background-color:#9fb8ff"></i><span>Glacier</span></button><button type="button" role="radio" aria-checked="false" aria-label="Use Oxidized teal effect color"><i aria-hidden="true" style="background-color:#76a891"></i><span>Oxidized teal</span></button><button type="button" role="radio" aria-checked="false" aria-label="Use Ember effect color"><i aria-hidden="true" style="background-color:#ff755f"></i><span>Ember</span></button></div></fieldset></div><p class="solcord-save-status" role="status">Saved</p><div class="solcord-live-preview solcord-mode-${document.documentElement.dataset.solcordMode}"><span>Appearance preview</span><strong>Readable hierarchy at every density.</strong><small>Focus, warning, success, and danger remain distinct.</small>${action("Keyboard focus sample")}</div>`)}${section("Accessibility", "Motion, contrast, and message shape stay under your control.", `<div class="solcord-setting-list">${toggle("Reduced motion", "Stops decorative transitions and follows the Windows preference.", params.get("motion") === "reduced")}${toggle("Reading ruler", "Keeps a restrained local focus line under the current message.")}${toggle(longCopy ? "Use a deliberately long localized accessibility label to prove that the control remains visible without horizontal overflow" : "Role contrast repair", "Improves hard-to-read role colors without changing identity cues.", true)}</div>`)}`,
        performance: () => `${heading("performance")}${section("Profile", "Lean, Balanced, and Visual are real resource policies.", `<div class="solcord-segmented" role="radiogroup"><button role="radio"><strong>Lean</strong><small>Only essential protection.</small></button><button role="radio" aria-checked="true"><strong>Balanced</strong><small>Recommended daily behavior.</small></button><button role="radio"><strong>Visual</strong><small>Optional previews and motion.</small></button></div>`)}${section("Resource limits", "Disabled modules own no patches, listeners, observers, timers, or network work.", `<div class="solcord-setting-list">${toggle("Performance HUD", "Bounded local sampling with no fake optimization claims.")}${toggle("Idle diagnostics", "Collects content-free resource counts only when this workspace is open.")}</div>`)}`,
        privacy: () => `${heading("privacy")}${section("Strict Privacy", "Blocks verified optional traffic while preserving core Discord operation.", `<div class="solcord-privacy-command"><div><strong>${state === "degraded" ? "Needs review" : "Protected"}</strong><p>${state === "degraded" ? "One optional client surface changed. Solcord blocks the known path and reports the gap honestly." : "Analytics, optional crash reports, activity discovery, and automatic Solcord checks are off."}</p></div>${action("Check now")}</div><div class="solcord-privacy-capabilities"><div><span>Telemetry<small>Discord analytics and science reporting.</small></span><strong class="solcord-privacy-state solcord-privacy-state-protected">Protected</strong></div><div><span>Crash reporting<small>Optional error and crash uploads.</small></span><strong class="solcord-privacy-state solcord-privacy-state-${state === "degraded" ? "degraded" : "protected"}">${state === "degraded" ? "Degraded" : "Protected"}</strong></div><div><span>Core Discord<small>Authentication, chat, voice, media, moderation, and security updates.</small></span><strong class="solcord-privacy-state solcord-privacy-state-unsupported">Allowed</strong></div></div>`)}${section("Local safety", "Private history stays off until separately enabled.", `<div class="solcord-setting-list">${toggle("Link Lens", "Review external links without intercepting Discord navigation.", true)}${toggle("Attachment review", "Inspect a file locally before upload; Solcord never submits it.")}</div>`)}`,
        chat: () => `${heading("chat")}${section("Composer Toolkit", "Small, reversible writing aids with no automatic sends.", `<div class="solcord-setting-list">${toggle("Double-click to reply", "Starts a normal Discord reply from an observed message.", true)}${toggle("Character counter", "Shows draft length without storing message text.", true)}${toggle("Guarded message split", "Previews bounded chunks for manual copy and confirmation.")}</div>`)}${section("Draft tools", "Everything remains local and explicit.", `<label class="solcord-field">Composer sandbox<textarea rows="4">A local preview that is never sent automatically.</textarea></label>`)}`,
        voice: () => `${heading("voice")}${section("Call Context", "Useful call information with complete teardown.", `<div class="solcord-setting-list">${toggle("Call timer", "Shows the current call duration.", true)}${toggle("Voice activity context", "Uses already-loaded call state.", true)}</div>`)}${section("Audience Guard", "Your stream will not start or continue while a denied user is detected in the current call or viewer list.", `<div class="solcord-audience-command"><div><strong>Disarmed</strong><p>Client-side stop guard only. It is not per-person media access control and cannot guarantee zero-frame exposure.</p></div>${action("Arm for this call")}</div>`)}<details class="solcord-experimental"><summary>Experimental</summary>${section("Fake Deafen", "Manual, call-bound, account-risk, and off by default.", `<div class="solcord-setting-row"><span><strong>Scoped Fake Deafen</strong><small>Disarms on disconnect, channel change, account change, drift, recovery, or disable.</small></span>${switchControl("Scoped Fake Deafen")}</div>`)}</details>`,
        friends: () => `${heading("friends")}${section("Friend Watch", "Opt-in relationship transitions from already-loaded state.", `<p class="solcord-privacy-summary">No messages, no network polling, and no guesses about who blocked whom.</p><div class="solcord-setting-list">${toggle("Keep relationship history", "Account-isolated encrypted local history with a clear retention limit.")}${toggle("Local summary", "Shows one bounded in-app summary after a new transition.")}</div>`)}${section("People & Spaces", "Local organization that never edits Discord servers or profiles.", `<div class="solcord-setting-list">${toggle("Pinned DMs", "Keep chosen conversations easy to reach.", true)}${toggle("Server aliases", "Private names stored only on this device.")}</div>`)}`,
        extensions: () => `${heading("extensions")}<div class="solcord-all-clear"><strong>Built-ins live with their features</strong><span>Message, voice, privacy, and people tools are managed in the matching workspace.</span></div><div class="solcord-native-ledger" aria-label="Built-in feature summary"><div class="solcord-native-row" data-native-layout><strong class="solcord-native-title">Composer Toolkit</strong><small class="solcord-native-replaces">Replaces CharCounter, CompleteTimestamps, DoubleClickToReply, and guarded SplitLargeMessages</small><span class="solcord-capability solcord-capability-ready">Ready</span></div><div class="solcord-native-row" data-native-layout><strong class="solcord-native-title">People and Spaces</strong><small class="solcord-native-replaces">Replaces BetterFriendList, PinDMs, ServerHider, ServerDetails, and local-only Server Aliases without editing Discord</small><span class="solcord-capability solcord-capability-ready">Ready</span></div></div><details class="solcord-extension-disclosure"><summary>Community plugins</summary><p>Optional plugins, migration, and troubleshooting details stay here until you need them.</p>${section("Provider migration", "A separate, reversible transaction with a verified rollback preview.", `<div class="solcord-setting-row"><span><strong>Duplicate providers</strong><small>No files move until preview and confirmation.</small></span>${action("Preview")}</div>`)}</details>`,
        recovery: () => `${heading("recovery")}${section("Setup", "Resume, rerun, or roll back first setup.", `<div class="solcord-setup-management"><div><strong>${state === "setup" ? "Setup saved for later" : "Setup complete"}</strong><p>Existing plugins, themes, and settings remain protected.</p></div><div class="solcord-actions">${action(state === "setup" ? "Resume setup" : "Run setup again")}${action("Rollback")}</div></div>`)}${section("Plugin Doctor", "Details expand only when something needs attention.", state === "degraded" ? `<div class="solcord-recovery-row"><div><strong>One addon needs review.</strong><p>It is quarantined and will not re-enable silently.</p></div>${action("Review addon", "danger")}</div>` : allClear)}<details class="solcord-secondary-tools"><summary>About and technical information</summary><dl class="solcord-facts"><div><dt>Runtime</dt><dd>Solcord V2 fixture</dd></div><div><dt>Diagnostics</dt><dd>Content-free</dd></div></dl></details>`
    };

    const setupScreen = () => `<section class="solcord-wizard" aria-labelledby="solcord-setup-title"><div class="solcord-wizard-title"><div><p class="solcord-eyebrow">First setup</p><h2 id="solcord-setup-title">Set up Solcord</h2><p>Five quick steps. Nothing changes until Apply.</p></div><span>2 / 5</span></div><div class="solcord-wizard-progress" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="2"><span style="width:40%"></span></div><ol class="solcord-wizard-steps"><li><button type="button" aria-label="1. Welcome"><span>1</span><span>Welcome</span></button></li><li><button type="button" aria-label="2. Privacy, current step" aria-current="step"><span>2</span><span>Privacy</span></button></li><li><button type="button" aria-label="3. Appearance"><span>3</span><span>Appearance</span></button></li><li><button type="button" aria-label="4. Features"><span>4</span><span>Features</span></button></li><li><button type="button" aria-label="5. Review and Apply"><span>5</span><span>Review and Apply</span></button></li></ol><div class="solcord-wizard-body"><h3>Choose your privacy baseline</h3><p>Strict Privacy blocks verified optional reporting. Discord essentials keep working.</p><div class="solcord-choice-grid solcord-choice-grid-two"><label class="solcord-choice-row"><input type="radio" name="privacy" checked><span><strong>Strict Privacy</strong><small>Recommended. Optional reporting and activity discovery stay off.</small></span></label><label class="solcord-choice-row"><input type="radio" name="privacy"><span><strong>Standard</strong><small>Discord optional reporting may run.</small></span></label></div></div><div class="solcord-wizard-footer"><div class="solcord-actions">${action("Back")}${action("Continue", "accent")}<button type="button" class="solcord-text-button">Finish later</button></div><p class="solcord-setup-status" role="status"></p></div></section>`;

    content.innerHTML = state === "wizard" ? setupScreen() : screens[workspace]();
    if (switchMatrix) content.insertAdjacentHTML("beforeend", section("Switch states", "Canonical off, on, disabled, hover, and keyboard-focus geometry.", `<div class="solcord-setting-list" data-switch-matrix>${toggle("Off state", "Gray track with a visible white thumb.")}${toggle("On state", "Teal track with the same visible white thumb.", true)}<div class="solcord-setting-row"><span><strong>Disabled state</strong><small>Still legible and visibly unavailable.</small></span>${switchControl("Disabled state", false, true)}</div></div>`));
    content.dataset.workspace = workspace;
    document.querySelectorAll("[data-workspace]").forEach(button => button.setAttribute("aria-current", button.dataset.workspace === workspace ? "page" : "false"));
    document.querySelector(".solcord-workspace-menu > summary").textContent = workspaceNames[workspace][0];

    const colorContext = document.createElement("canvas").getContext("2d", {willReadFrequently: true});
    colorContext.canvas.width = 1;
    colorContext.canvas.height = 1;
    const rgba = (value) => {
        colorContext.clearRect(0, 0, 1, 1);
        colorContext.fillStyle = "rgba(0, 0, 0, 0)";
        colorContext.fillStyle = value;
        colorContext.fillRect(0, 0, 1, 1);
        const [red, green, blue, alpha] = colorContext.getImageData(0, 0, 1, 1).data;
        return [red, green, blue, alpha / 255];
    };
    const blend = (foreground, background) => {
        const alpha = foreground[3] + background[3] * (1 - foreground[3]);
        if (!alpha) return [0, 0, 0, 0];
        return [
            (foreground[0] * foreground[3] + background[0] * background[3] * (1 - foreground[3])) / alpha,
            (foreground[1] * foreground[3] + background[1] * background[3] * (1 - foreground[3])) / alpha,
            (foreground[2] * foreground[3] + background[2] * background[3] * (1 - foreground[3])) / alpha,
            alpha
        ];
    };
    const effectiveBackground = (element) => {
        const layers = [];
        for (let current = element; current; current = current.parentElement) layers.push(rgba(getComputedStyle(current).backgroundColor));
        return layers.reverse().reduce((background, foreground) => blend(foreground, background), [255, 255, 255, 1]);
    };
    const luminance = (value) => value.slice(0, 3).map(channel => {
        const normalized = channel / 255;
        return normalized <= 0.03928 ? normalized / 12.92 : ((normalized + 0.055) / 1.055) ** 2.4;
    }).reduce((sum, channel, index) => sum + channel * [0.2126, 0.7152, 0.0722][index], 0);
    const contrast = (foreground, background) => {
        const a = luminance(foreground);
        const b = luminance(background);
        return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    };
    const elementContrast = (element) => contrast(rgba(getComputedStyle(element).color), effectiveBackground(element));
    const visible = (element) => {
        if (element.closest(".sr-only")) return false;
        const closedDisclosure = element.closest("details:not([open])");
        if (closedDisclosure && element !== closedDisclosure.querySelector(":scope > summary")) return false;
        const style = getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
    };
    const inspect = () => {
        const panel = document.querySelector(".solcord-panel");
        const panelRect = panel.getBoundingClientRect();
        const visibleElements = [...panel.querySelectorAll("*")].filter(visible);
        const overflow = visibleElements.filter(element => {
            const rect = element.getBoundingClientRect();
            return rect.left < panelRect.left - 1 || rect.right > panelRect.right + 1 || element.scrollWidth > element.clientWidth + 1;
        }).map(element => element.className || element.tagName).slice(0, 20);
        const focusables = [...panel.querySelectorAll("button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), summary, [href], [tabindex]:not([tabindex='-1'])")].filter(visible);
        const focusFailures = focusables.filter(element => { element.focus({preventScroll: true}); return document.activeElement !== element; }).map(element => element.outerHTML.slice(0, 80));
        const headingCopy = panel.querySelector(".solcord-workspace-heading p, .solcord-wizard-title p");
        const navButton = panel.querySelector(".solcord-workspace-nav button");
        const settingTitle = panel.querySelector(".solcord-setting-row strong");
        const settingCopy = panel.querySelector(".solcord-setting-row small");
        const navElement = document.querySelector(".solcord-workspace-nav");
        const searchElement = document.querySelector(".solcord-workspace-search");
        const menuElement = document.querySelector(".solcord-workspace-menu");
        const nav = navElement.getBoundingClientRect();
        const area = content.getBoundingClientRect();
        const horizontalOverlap = Math.max(0, Math.min(nav.right, area.right) - Math.max(nav.left, area.left));
        const verticalOverlap = Math.max(0, Math.min(nav.bottom, area.bottom) - Math.max(nav.top, area.top));
        const sideBySide = nav.right <= area.left + 1;
        const stacked = nav.bottom <= area.top + 1;
        const nativeRowSpacingFailures = [...document.querySelectorAll("[data-native-layout]")].flatMap(row => {
            const title = row.querySelector(".solcord-native-title")?.getBoundingClientRect();
            const replacement = row.querySelector(".solcord-native-replaces")?.getBoundingClientRect();
            const status = row.querySelector(".solcord-capability")?.getBoundingClientRect();
            if (!title || !replacement || !status) return ["missing-column"];
            const overlaps = (left, right) => Math.min(left.right, right.right) > Math.max(left.left, right.left) && Math.min(left.bottom, right.bottom) > Math.max(left.top, right.top);
            if (overlaps(title, replacement) || overlaps(replacement, status) || overlaps(title, status)) return [row.textContent.trim().slice(0, 80)];
            if (replacement.top < title.bottom && replacement.left - title.right < 8) return [row.textContent.trim().slice(0, 80)];
            if (status.top < replacement.bottom && status.left - replacement.right < 8) return [row.textContent.trim().slice(0, 80)];
            return [];
        });
        const compactNavigation = getComputedStyle(document.querySelector(".solcord-workspace-nav-list")).display === "none";
        const compactNavigationGeometry = compactNavigation ? {
            searchHidden: getComputedStyle(searchElement).display === "none",
            menuVisible: visible(menuElement.querySelector(":scope > summary")),
            opaqueBackground: rgba(getComputedStyle(navElement).backgroundColor)[3] === 1,
            singleColumn: getComputedStyle(navElement).gridTemplateColumns.trim().split(/\s+/).length === 1
        } : null;
        const diagnosticWarning = document.querySelector(".solcord-build-warning");
        const switchStateFailures = [...document.querySelectorAll(".solcord-switch")].flatMap(control => {
            const input = control.querySelector("input[role='switch']");
            const track = control.querySelector(".solcord-switch-track");
            const thumb = control.querySelector(".solcord-switch-thumb");
            if (!input || !track || !thumb) return ["missing-switch-part"];
            const trackRect = track.getBoundingClientRect();
            const thumbRect = thumb.getBoundingClientRect();
            const thumbColor = rgba(getComputedStyle(thumb).backgroundColor);
            if (trackRect.width < 36 || trackRect.height < 20 || thumbRect.width < 14 || thumbRect.height < 14) return [input.getAttribute("aria-label") || "switch-geometry"];
            if (thumbColor[0] < 245 || thumbColor[1] < 245 || thumbColor[2] < 245 || thumbColor[3] < 1) return [input.getAttribute("aria-label") || "switch-thumb"];
            if (input.checked && getComputedStyle(thumb).transform === "none") return [input.getAttribute("aria-label") || "switch-on-position"];
            if (input.disabled && Number(getComputedStyle(track).opacity) >= 1) return [input.getAttribute("aria-label") || "switch-disabled"];
            return [];
        });
        let switchFocusVisible = true;
        const focusSwitch = document.querySelector(".solcord-switch > input:not(:disabled)");
        if (focusSwitch) {
            document.body.dispatchEvent(new KeyboardEvent("keydown", {key: "Tab", bubbles: true}));
            focusSwitch.focus({preventScroll: true});
            const focusTrack = focusSwitch.nextElementSibling;
            switchFocusVisible = focusTrack && parseFloat(getComputedStyle(focusTrack).outlineWidth) >= 2;
        }
        const result = {
            scenario: {workspace, state, diagnostic, mode: document.documentElement.dataset.solcordMode, theme: document.documentElement.dataset.solcordFixtureTheme, motion: document.documentElement.dataset.solcordEffectiveMotion, scale: Number(document.documentElement.dataset.solcordFixtureScale), width: innerWidth, height: innerHeight, devicePixelRatio},
            horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
            clippedOrOverflowingElements: overflow,
            focusableCount: focusables.length,
            focusFailures,
            workspaceHeadingCount: content.querySelectorAll(":scope > .solcord-workspace-heading").length,
            nativeRowSpacingFailures,
            switchStateFailures,
            switchFocusVisible,
            diagnosticIdentity: {requested: diagnostic, warningVisible: Boolean(diagnosticWarning && visible(diagnosticWarning))},
            navigationRelationship: {sideBySide, stacked, horizontalOverlap: Number(horizontalOverlap.toFixed(2)), verticalOverlap: Number(verticalOverlap.toFixed(2))},
            compactNavigationGeometry,
            contrast: {
                normal: Number(elementContrast(panel).toFixed(2)),
                muted: Number(elementContrast(headingCopy).toFixed(2)),
                navigation: Number(elementContrast(navButton).toFixed(2)),
                settingTitle: settingTitle ? Number(elementContrast(settingTitle).toFixed(2)) : null,
                settingCopy: settingCopy ? Number(elementContrast(settingCopy).toFixed(2)) : null
            },
            reducedMotion: document.documentElement.dataset.solcordEffectiveMotion === "reduced" ? getComputedStyle(focusables[0]).transitionDuration : "not-requested"
        };
        const expectedHeadingCount = state === "wizard" ? 0 : 1;
        const contrastSamples = Object.values(result.contrast).filter(value => value !== null);
        const compactNavigationPass = !compactNavigationGeometry || Object.values(compactNavigationGeometry).every(Boolean);
        result.pass = !result.horizontalOverflow && !overflow.length && !focusFailures.length && !result.nativeRowSpacingFailures.length && !result.switchStateFailures.length && result.switchFocusVisible && result.workspaceHeadingCount === expectedHeadingCount && result.diagnosticIdentity.warningVisible === diagnostic && contrastSamples.every(value => value >= 4.5) && (sideBySide || stacked) && compactNavigationPass;
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(result))));
        document.body.dataset.fixtureResult = encoded;
        document.querySelector("#fixture-result").textContent = JSON.stringify(result, null, 2);
        document.activeElement?.blur();
    };
    const publishFixtureError = (error) => {
        const detail = error instanceof Error ? `${error.name}: ${error.message}\n${error.stack || ""}` : String(error);
        document.body.dataset.fixtureError = btoa(unescape(encodeURIComponent(detail)));
    };
    try { inspect(); }
    catch (error) { publishFixtureError(error); }
</script>
</body>
