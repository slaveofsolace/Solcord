name: Solcord generated audit refresh

on:
  push:
    branches: ["audit/solcord-foundation"]

permissions:
  contents: write

concurrency:
  group: solcord-generated-audit-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Regenerate persistent repository audit
        run: node scripts/audit-solcord-repository.mjs

      - name: Commit refreshed audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/FULL_REPOSITORY_AUDIT.md
          if git diff --cached --quiet; then
            echo "Audit report is already current."
          else
            git commit -m "docs(audit): refresh installer-fix inventory"
            git push origin HEAD:audit/solcord-foundation
          fi
