name: Solcord final documentation verification

on:
  push:
    branches: ["audit/solcord-foundation"]

permissions:
  contents: write

concurrency:
  group: solcord-final-documentation
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Render repository social preview
        shell: bash
        run: |
          output="assets/branding/solcord-social-preview.png"
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends librsvg2-bin
          fi
          rsvg-convert -w 1200 -h 630 assets/branding/solcord-social-preview.svg -o "$output"
          test -s "$output"
          dimensions="$(file "$output")"
          case "$dimensions" in
            *"1200 x 630"*) ;;
            *) echo "Unexpected social preview dimensions: $dimensions"; exit 1 ;;
          esac

      - name: Regenerate persistent repository audit
        run: node scripts/audit-solcord-repository.mjs

      - name: Commit generated presentation and audit files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/branding/solcord-social-preview.png docs/audit/FULL_REPOSITORY_AUDIT.md
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "docs(audit): refresh final presentation and inventory"
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Verify source
        run: bun run verify

      - name: Build production package
        run: bun run dist
        env:
          BRANCH_NAME: audit/solcord-foundation
          COMMIT_HASH: ${{env.SOURCE_SHA}}

      - name: Push generated commit
        run: git push origin HEAD:audit/solcord-foundation
