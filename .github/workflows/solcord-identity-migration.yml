name: Solcord identity migration

on:
  push:
    branches: ["audit/solcord-foundation"]

permissions:
  contents: write

concurrency:
  group: solcord-identity-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Prepare pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Rename product paths and text
        run: bun scripts/rename-soulcord-to-solcord.mjs

      - name: Rebuild exact runtime catalog
        run: node scripts/build-solcord-runtime-catalog.cjs

      - name: Remove one-time migration machinery
        run: rm -f scripts/rename-soulcord-to-solcord.mjs .github/workflows/solcord-identity-migration.yml

      - name: Enforce complete identity migration
        shell: bash
        run: |
          git add -A
          if git ls-files | grep -Eiq 'soul([ _-]?cord)'; then
            echo "Old identity remains in the final tracked paths."
            git ls-files | grep -Ei 'soul([ _-]?cord)'
            exit 1
          fi
          if git grep -I -n -Ei 'soul([ _-]?cord)' -- .; then
            echo "Old identity remains in tracked text."
            exit 1
          fi
          git diff --cached --check

      - name: Create unpushed clean migration commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(identity): rename Soulcord to Solcord"
          echo "MIGRATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Verify source
        run: |
          bun run test
          bun run lint
          bun run lint-css:solcord
          bun run typecheck
          bun run generate-types
          bun run circulars
          bun run dist
        env:
          BRANCH_NAME: audit/solcord-foundation
          COMMIT_HASH: ${{env.MIGRATION_SHA}}

      - name: Restore workflow files for the permission-limited push
        shell: bash
        run: |
          git checkout origin/audit/solcord-foundation -- .github/workflows
          git add -A
          git commit --amend --no-edit
          test -z "$(git diff --name-only origin/audit/solcord-foundation...HEAD -- .github/workflows)"

      - name: Push verified non-workflow migration
        shell: bash
        run: git push origin HEAD:audit/solcord-foundation
