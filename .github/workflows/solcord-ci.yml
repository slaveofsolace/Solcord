name: Solcord V2 CI

on:
  push:
    branches: ["fork/**", "v2/**", "audit/**"]
  pull_request:
    branches: ["development"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify source and production package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Test
        run: bun run test
      - name: Lint TypeScript
        run: bun run lint
      - name: Lint Solcord CSS
        run: bun run lint-css:solcord
      - name: Typecheck
        run: bun run typecheck
      - name: Generate public compatibility types
        run: bun run generate-types
      - name: Check circular dependencies
        run: bun run circulars
      - name: Build and package
        run: bun run dist
        env:
          BRANCH_NAME: ${{github.head_ref || github.ref_name}}
          COMMIT_HASH: ${{github.sha}}
      - name: Upload review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solcord-review-${{github.sha}}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/solcord.asar
            dist/checksums.txt
            dist/solcord-build-manifest.json

  windows-policy:
    name: Windows policy, safety, and installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Prepare .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.424
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Run Windows-sensitive fixtures
        run: bun test tests/electron/preload-policy.test.ts tests/electron/original-preload.test.ts tests/solcord/safety.test.ts tests/solcord/settings.test.ts
      - name: Typecheck
        run: bun run typecheck
      - name: Build self-contained installer candidate
        shell: pwsh
        run: bun run installer:candidate -- dist/solcord.asar "$env:RUNNER_TEMP\solcord-v2-installer" "$env:GITHUB_SHA"
        env:
          BRANCH_NAME: ${{github.head_ref || github.ref_name}}
          COMMIT_HASH: ${{github.sha}}
      - name: Upload Windows installer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solcord-v2-installer-${{github.sha}}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{runner.temp}}/solcord-v2-installer
