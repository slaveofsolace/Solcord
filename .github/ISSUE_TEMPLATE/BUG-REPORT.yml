name: Bug report
description: Something in Solcord, a theme, or the installer is not working.
title: "[Bug] "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before posting
      options:
        - label: I checked existing issues for the same problem.
          required: true
        - label: My attachments contain no tokens, private messages, account IDs, server names, or personal file paths.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include the workspace, setting, or installer action.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Choose...
        3. The problem appears...
    validations:
      required: true
  - type: textarea
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    attributes:
      label: Solcord candidate and source
      description: Open Solcord Suite, then Recovery, then About and technical information. Include Candidate and Source. For installer problems, include its title-bar version.
      placeholder: v2.0.0-rc.33, source commit
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Discord installation
      options:
        - Stable
        - PTB
        - Canary
    validations:
      required: true
  - type: input
    attributes:
      label: Discord app version
      placeholder: 1.0.9255, or not sure
    validations:
      required: true
  - type: input
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11, 150%
    validations:
      required: true
  - type: textarea
    attributes:
      label: Plugins, themes, or other context
      description: List relevant enabled addons and whether the issue persists with a conflicting addon disabled. Do not erase settings or private data to test.
  - type: textarea
    attributes:
      label: Error or screenshot
      description: Include the exact error and a cropped, privacy-clean screenshot if useful. Do not attach raw Discord logs or private databases.
