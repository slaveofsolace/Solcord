name: SoulCord bug report
description: Report a reproducible SoulCord, installer, theme, or compatibility problem.
title: "[Bug]"
labels: [bug]
body:
- type: checkboxes
  attributes:
    label: Before Reporting
    description: Check these before sharing diagnostics.
    options:
    - label: I found no existing issues matching my bug
      required: true
    - label: I tested with unrelated third-party plugins and themes disabled, or explained why I could not
      required: false
    - label: I removed tokens, private messages, server names, account IDs, and local user paths from attachments
      required: true
- type: textarea
  attributes:
    label: Describe the Bug
    description: What happened? Include the exact SoulCord surface or installer step.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: What should have happened instead?
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. Open...
      2. Choose...
      3. Observe...
  validations:
    required: true
- type: dropdown
  attributes:
    label: Operating System
    options:
      - Windows
      - MacOS
      - Linux
  validations:
    required: true
- type: dropdown
  attributes:
    label: Discord Version
    options:
      - Stable
      - Canary
      - PTB
  validations:
    required: true
- type: input
  attributes:
    label: SoulCord Version
    description: This is shown in `Settings > Updater` as the SoulCord Core version.
    placeholder: v2.0.0-rc.1
  validations:
    required: true
- type: textarea
  attributes:
    label: Sanitized diagnostics or screenshots
    description: |
      Attach only SoulCord's sanitized diagnostic export or privacy-clean screenshots. Never post a Discord token, private message/server content, account identifier, or absolute local path.
  validations:
    required: false
