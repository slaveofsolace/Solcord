name: Feature request
description: Suggest a useful addition or improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Before posting
      options:
        - label: I checked existing requests for the same idea.
          required: true
  - type: textarea
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How should it work?
      description: A short example is enough. Links to related work are welcome.
  - type: textarea
    attributes:
      label: Privacy or compatibility concerns
      description: Mention any network access, private data, account action, or third-party dependency involved.
