name: Solcord feature request
description: Propose a focused addition or improvement with a clear user benefit.
title: "[Feature]"
labels: [enhancement]
body:
- type: checkboxes
  attributes:
    label: Before Requesting
    description: "I have double checked and agree with the following:"
    options:
    - label: I found no existing issue matching my feature request
      required: true
- type: textarea
  attributes:
    label: What problem should Solcord solve?
    description: Describe the current friction, who experiences it, and the result you want.
  validations:
    required: true
- type: textarea
  attributes:
    label: Safety, privacy, or compatibility considerations
    description: |
      Explain any network access, account action, message/media handling, Discord-internal adapter, or third-party source involved. Include rights-clear references when useful.
  validations:
    required: false
